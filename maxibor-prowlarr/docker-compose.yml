version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: maxibor-gluetun_server_1
      APP_PORT: 9696
      #PROXY_AUTH_WHITELIST: /api/*
      PROXY_AUTH_ADD: 'false'

  server:
    image: linuxserver/prowlarr:version-2.3.0.5236@sha256:484784daaf4c081e55c608de256870184d283762e1b64e8105af487b1510fc4a
    network_mode: "container:maxibor-gluetun_server_1"
    depends_on:
      maxibor-gluetun_server_1:        # 👈 wait for Gluetun to be healthy first
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    labels:
      - "autoheal=true"               # 👈 watched by autoheal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9696/api/v1/health?apikey=${PROWLARR_API_KEY}"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped