services:
  app_proxy:
    environment:
      APP_HOST: maxibor-gluetun_server_1
      APP_PORT: 8090
      PROXY_AUTH_WHITELIST: "*"
      PROXY_AUTH_ADD: 'false'

  server:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: "container:maxibor-gluetun_server_1"
    depends_on:
      maxibor-gluetun_server_1:        # 👈 wait for Gluetun to be healthy first
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/home/Downloads/complete:/downloads
      - ${UMBREL_ROOT}/home/Downloads/incomplete:/incomplete
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - WEBUI_PORT=8090
    labels:
      - "autoheal=true"               # 👈 watched by autoheal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    restart: unless-stopped
    stop_grace_period: 1m