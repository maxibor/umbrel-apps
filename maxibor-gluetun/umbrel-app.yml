manifestVersion: 1.1
id: maxibor-gluetun
name: 1.0 Gluetun VPN
tagline: Lightweight VPN client with support for multiple providers
icon: https://raw.githubusercontent.com/MartinMeel/umbrel-app-gallery/main/martinmeel-gluetun/gluetun.svg
category: networking
version: "3.41.3"
port: 8000
description: >-
  Gluetun is a lightweight VPN client written in Go that supports multiple VPN providers
  including ProtonVPN, Windscribe etc. It acts as a VPN gateway for other Docker containers, allowing
  them to route their traffic through the VPN connection.
  
  
  This setup is pre-configured for ProtonVPN Wireguard but supports many other providers. Other
  containers can route their traffic through Gluetun by using its network stack.
  
  
  Key features:
    - Support for multiple VPN providers (Windscribe, NordVPN, ExpressVPN, CyberGhost, etc.)
    - Built-in firewall with kill switch
    - DNS over TLS (DoT) support
    - HTTP proxy server
    - Health monitoring and automatic reconnection
    - Port forwarding support (provider dependent)
  
  ⚠️ IMPORTANT:
    Before installing, make sure you have your VPN credentials ready.
    You'll need to configure credentials in the exports.sh file.
    https://github.com/qdm12/gluetun-wiki


  🛠️ SET-UP INSTRUCTIONS
    After installing Gluetun STOP the container and fill in your credentials in the exports file!
    ⚠️ NOTE: Please ssh into your umbrel or via the settings icon -> Advanced settings -> Terminal (open) to change the exports file.


  Logs:  
    ⚠️ NOTE: To follow the logs of the Gluetun container:
    Please ssh into your umbrel or via the settings icon -> Advanced settings -> Terminal (open)
    - sudo docker logs -f maxibor-gluetun_server_1


releaseNotes: >-
  Update Gluetun to v3.41.3 with upstream provider and security updates, updated server endpoints, and stability fixes.
submitter: maxibor
