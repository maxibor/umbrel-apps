services:
  server:
    image: ghcr.io/maxibor/gluetun:ui-auth@sha256:099159eb4ee9472760c104a258bde430f7f0317fa233a8eca5d65bd59eb681b9
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
      - "8000:8000"
    volumes:
      - ${APP_DATA_DIR}/data:/gluetun
    environment:
      # CyberGhost VPN Configuration
      - VPN_SERVICE_PROVIDER=cyberghost
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${CYBERGHOST_USERNAME}
      - OPENVPN_PASSWORD=${CYBERGHOST_PASSWORD}
      - OPENVPN_CERT=${OPENVPN_CERT}
      - OPENVPN_KEY=${OPENVPN_KEY}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      # Enable Control server & Web UI
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_LOG=on
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"basic","username":"${GLUETUN_USER:-admin}","password":"${GLUETUN_PASSWORD:-admin}"}
      - TZ=Europe/Amsterdam
    restart: unless-stopped
    stop_grace_period: 1m